# This workflow does a clean installation of node dependencies, caches them,
# lints, builds, and (once test suites exist) tests the client and server.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  pull_request:
    branches: ["prod", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install client deps
        run: cd client && npm i --legacy-peer-deps
      - name: Install server deps
        run: cd server && npm i --legacy-peer-deps

      # Lints without --fix so CI fails on issues instead of silently
      # rewriting files (the "lint" npm script is for local dev use).
      - name: Lint client
        run: cd client && npx eslint .
      - name: Lint server
        run: cd server && npx eslint .

      - name: Build client
        run: cd client && npm run build --if-present
      - name: Build server
        run: cd server && npm run build --if-present

      # No-ops until "test" scripts are added to client/server package.json,
      # so a future test suite is picked up automatically without touching CI.
      - name: Test client
        run: cd client && npm test --if-present
      - name: Test server
        run: cd server && npm test --if-present
